<head>

  <meta property="og:title" content="Undangan Pernikahan Togu Marbun & Melani boru Sinaga">

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0d0404;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbw-pzdbbyWZyr23-RGP8t-SN-2hHVTpXzfpHnwjaMSoVUGKepYeiAkE_iOA2N4rBU_a/exec"

    allow="autoplay *; encrypted-media *; fullscreen *; picture-in-picture *; clipboard-write *"
    allowfullscreen
  ></iframe>
  <script>
    (function () {
      var params = window.location.search;
      if (params) {
        var frame = document.getElementById('gasFrame');
        if (frame) {
          frame.src = frame.src.split('?')[0] + params;
        }
      }
    })();
  </script>
